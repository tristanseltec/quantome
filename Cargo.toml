[workspace]
resolver = "3"
members = ["crates/book-core", "crates/book-ui", "crates/book-cli"]

[workspace.package]
authors = ["The Quantome contributors"]
homepage = "https://tristanseltec.github.io/quantome/"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/tristanseltec/quantome"

[workspace.dependencies]
book-core = { path = "crates/book-core" }
book-ui = { path = "crates/book-ui" }
leptos = { version = "0.8.23", default-features = false, features = ["ssr"] }
pulldown-cmark = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tower-http = { version = "0.7", features = ["fs"] }

[profile.release]
lto = "thin"
