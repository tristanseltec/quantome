  "Targets come from your unit's neonatal protocol and dietitian; growth is the real test.",
]

[formula."clin.nutrition.mifflin_st_jeor"]
title = "Resting energy expenditure (Mifflin–St Jeor)"
level = "L1"
reviewers = []
chapter = "clinical-mathematics/nutrition-energy-and-parenteral-calculations"
sources = ["Mifflin MD, St Jeor ST, et al. A new predictive equation for resting energy expenditure in healthy individuals. Am J Clin Nutr 1990;51(2):241–247."]
caveats = ["Healthy adults; not validated for children or critical illness (use indirect calorimetry where available)."]

[formula."clin.growth.cdc_bmi_for_age"]
title = "BMI-for-age z-score and centile (CDC 2000, 2–20 years)"
level = "L1"
reviewers = []
chapter = "clinical-mathematics/growth-and-bmi-in-children"
sources = [
  "CDC 2000 growth charts, BMI-for-age LMS file bmiagerev.csv (bundled).",
  "Cole TJ. The LMS method for constructing normalized growth standards. Eur J Clin Nutr 1990;44(1):45–60.",
]
caveats = [
  "CDC references (US); many countries use WHO (0–5 standards, 5–19 references) or UK-WHO/UK90 charts with different cut-offs.",
  "Severe obesity is classified by % of the 95th centile, not by z-score.",
  "Plot serial measurements; a single value is a screening result, not a diagnosis.",
]

