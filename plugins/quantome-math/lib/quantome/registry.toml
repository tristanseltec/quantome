[formula."clin.renal.cockcroft_gault"]
title = "Creatinine clearance (Cockcroft–Gault)"
level = "L1"
reviewers = []
chapter = "clinical-mathematics/weight-and-body-size-based-dosing"
sources = ["Cockcroft DW, Gault MH. Prediction of creatinine clearance from serum creatinine. Nephron 1976;16(1):31–41."]
caveats = [
  "Adults only; unreliable with unstable creatinine (AKI), extremes of muscle mass, or amputation.",
  "Many drug references specify Cockcroft–Gault rather than eGFR for dose adjustment; check which.",
]

