# Quantome formula registry: one entry per public formula.
#
# level: L0 draft · L1 machine-verified (tests from source values pass, citations resolve)
#        L2 expert-reviewed (named domain reviewer) · L3 externally validated
# Clinical skills are released as "preview" until every formula they use reaches L2 (see docs/VISION.md).
# Reviewers: add yourself to `reviewers` with your role when you sign off, and raise `level`.

[formula."clin.fluids.holliday_segar"]
title = "Maintenance fluids (Holliday–Segar)"
level = "L1"
reviewers = []
chapter = "clinical-mathematics/maintenance-fluids-holliday-segar"
sources = ["Holliday MA, Segar WE. The maintenance need for water in parenteral fluid therapy. Pediatrics 1957;19(5):823–832."]
caveats = [
  "Use isotonic maintenance fluids (AAP 2018 guideline; NICE NG29 children, CG174 adults) to avoid iatrogenic hyponatraemia.",
  "Restrict to 50–80 % of maintenance where ADH secretion is raised (NICE NG29).",
  "Not for neonates (< 28 days): use day-of-life neonatal protocols.",
  "Monitor electrolytes, weight and fluid balance.",
]

[formula."clin.fluids.deficit"]
title = "Dehydration deficit"
level = "L1"
reviewers = []
chapter = "clinical-mathematics/maintenance-fluids-holliday-segar"
sources = ["Standard paediatric teaching: deficit (mL) = % dehydration × weight (kg) × 10; see NICE NG29 for replacement."]
caveats = ["Clinical estimates of % dehydration are imprecise; reassess frequently.", "Shock is treated with fluid boluses first, per local guidance."]

[formula."clin.fluids.parkland"]
title = "Burns resuscitation (Parkland)"
level = "L1"
reviewers = []
chapter = "clinical-mathematics/maintenance-fluids-holliday-segar"
sources = ["Baxter CR, Shires T. Physiological response to crystalloid resuscitation of severe burns. Ann N Y Acad Sci 1968;150(3):874–894."]
caveats = [
  "Timing runs from the time of the burn, not arrival.",
  "ATLS 10th edition starts adults at 2 mL/kg/%TBSA (3 for children); follow your burns service protocol.",
  "Children also need maintenance fluid in addition.",
]

[formula."clin.dosing.weight_based"]
title = "Weight-based dose with maximum cap"
level = "L1"
reviewers = []
chapter = "clinical-mathematics/weight-and-body-size-based-dosing"
sources = ["Standard pharmaceutical calculation; dose limits must come from the current formulary (e.g. BNF/BNFc)."]
caveats = [
  "The mg/kg value and maximum dose must come from the current formulary, not from this tool.",
  "Confirm which weight the drug reference uses (actual, ideal or adjusted).",
  "Independent double-check required before administration.",
]

