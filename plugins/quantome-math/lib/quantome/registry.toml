[formula."clin.nutrition.gir"]
title = "Glucose infusion rate"
level = "L1"
reviewers = []
chapter = "clinical-mathematics/infant-and-neonatal-nutrition"
sources = [
  "Derived from units: d % = 10d mg/mL.",
  "Target ranges: Mesotten D, et al. ESPGHAN/ESPEN/ESPR/CSPEN guidelines on pediatric parenteral nutrition: carbohydrates. Clin Nutr 2018;37(6 Pt B):2337–2343.",
]
caveats = ["Adjust to measured blood glucose per protocol.", "Peripheral dextrose is commonly limited to ~12.5 % (unit rule)."]

[formula."clin.nutrition.infant_regimen"]
title = "Infant enteral + parenteral regimen summary"
level = "L1"
reviewers = []
chapter = "clinical-mathematics/infant-and-neonatal-nutrition"
sources = [
  "ESPGHAN/ESPEN/ESPR/CSPEN guidelines on pediatric parenteral nutrition. Clin Nutr 2018;37(6 Pt B).",
  "Embleton ND, et al. Enteral nutrition in preterm infants (2022). J Pediatr Gastroenterol Nutr 2023;76(2):248–268.",
]
caveats = [
  "Energy densities are approximate (dextrose 3.4 kcal/g, amino acids 4 kcal/g, 20 % lipid ~2 kcal/mL); use product labels.",
