name: Check, build & deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Validate content (links, answers, front matter)
        run: cargo run --release -p book-cli -- check
      # Project pages are served under /<repo>/; drop --base-url for a custom domain.
      - run: cargo run --release -p book-cli -- build --base-url "/${{ github.event.repository.name }}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  library-and-plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Formula library tests (test cases from the original sources)
        run: |
          python -m pip install -e 'py[test]'
          python -m pytest py -q
      - name: Vendored library is in sync with py/src/quantome
        run: python scripts/sync_plugins.py --check
      - name: Skill scripts run from the plugin layout
        run: |
          python -I plugins/quantome-clinical/skills/iv-fluids/scripts/qcalc.py fluids --weight 25
          python -I plugins/quantome-clinical/skills/paediatric-growth/scripts/qcalc.py --json bmi-z --sex F --age-months 120 --weight 40 --height-cm 140
          python -I plugins/quantome-math/skills/solve-and-verify/scripts/qmath.py choices --answer "comb(5,2)/comb(8,2)" --choices "A=5/14,B=3/8,C=1/4,D=5/28,E=2/7"
          python -I plugins/quantome-math/skills/data-sufficiency/scripts/qmath.py ds --question "x > 0" --s1 "x**2 == 9" --s2 "x**3 == 27" --domain "x=int:-20..20"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate marketplace and plugins
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate --strict .
          claude plugin validate --strict plugins/quantome-clinical
          claude plugin validate --strict plugins/quantome-author
          claude plugin validate --strict plugins/quantome-math

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build, library-and-plugins]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
