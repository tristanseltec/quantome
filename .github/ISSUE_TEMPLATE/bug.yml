name: Website or engine bug
description: Something wrong with the site, search, rendering or the Rust tooling
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Browser/OS or Rust version
